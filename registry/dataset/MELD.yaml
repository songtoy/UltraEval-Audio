meld-emo:
  class: audio_evals.dataset.huggingface.Huggingface
  args:
    name: TwinkStart/MELD
    split: test
    default_task: emotion_analysis
    ref_col: Emotion
    local_path: /root/zhoust/Impros/bench/MELD/data

meld-choices:
  class: audio_evals.dataset.huggingface.Huggingface
  args:
    name: TwinkStart/MELD
    split: test
    default_task: meld_choices
    ref_col: emotion_choice
    local_path: /root/zhoust/Impros/bench/MELD/test_reformatted

meld-sentiment:
  class: audio_evals.dataset.huggingface.Huggingface
  args:
    name: TwinkStart/MELD
    split: test
    default_task: sentiment_analysis
    ref_col: Sentiment
